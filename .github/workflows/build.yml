name: Build firmware

"on":
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [heltec-lora32-v2, ttgo-t-display, mini-d1]
    steps:
      - uses: actions/checkout@v4

      # The ESP-IDF toolchain/framework PlatformIO downloads on first build
      # is a few hundred MB - caching it is the difference between a ~1min
      # and a ~10min run.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ matrix.environment }}-

      # Pinned, not "3.x": a floating version grabs whatever's newest on the
      # runner, which can be newer than ESP-IDF's own pinned Python deps
      # support - e.g. pydantic-core's PyO3 build broke on a bleeding-edge
      # interpreter here (flaky per-job depending on prebuilt-wheel
      # availability, not a real code issue). 3.12 has solid wheel coverage
      # for everything PlatformIO/ESP-IDF pull in.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --upgrade platformio

      - run: pio run -e ${{ matrix.environment }}

      # Same four files tools/package_web_flasher.sh picks up for the
      # browser-based USB flasher (see tools/web-flash/) and what a manual
      # `pio run -t upload` writes to flash - handy to grab straight from a
      # CI run without building locally.
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: |
            .pio/build/${{ matrix.environment }}/firmware.bin
            .pio/build/${{ matrix.environment }}/bootloader.bin
            .pio/build/${{ matrix.environment }}/partitions.bin
            .pio/build/${{ matrix.environment }}/ota_data_initial.bin
          if-no-files-found: error
