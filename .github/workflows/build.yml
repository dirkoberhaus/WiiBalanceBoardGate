name: Build firmware

"on":
  push:
  pull_request:
  workflow_dispatch:

# Default to read-only; the deploy-pages job below opts into pages/id-token
# write for just that job, not the whole workflow.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [heltec-lora32-v2, ttgo-t-display, mini-d1]
    steps:
      - uses: actions/checkout@v4

      # The ESP-IDF toolchain/framework PlatformIO downloads on first build
      # is a few hundred MB - caching it is the difference between a ~1min
      # and a ~10min run.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ matrix.environment }}-

      # Pinned, not "3.x": a floating version grabs whatever's newest on the
      # runner, which can be newer than ESP-IDF's own pinned Python deps
      # support - e.g. pydantic-core's PyO3 build broke on a bleeding-edge
      # interpreter here (flaky per-job depending on prebuilt-wheel
      # availability, not a real code issue). 3.12 has solid wheel coverage
      # for everything PlatformIO/ESP-IDF pull in.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --upgrade platformio

      - run: pio run -e ${{ matrix.environment }}

      # Same four files tools/package_web_flasher.sh picks up for the
      # browser-based USB flasher (see tools/web-flash/) and what a manual
      # `pio run -t upload` writes to flash - handy to grab straight from a
      # CI run without building locally.
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: |
            .pio/build/${{ matrix.environment }}/firmware.bin
            .pio/build/${{ matrix.environment }}/bootloader.bin
            .pio/build/${{ matrix.environment }}/partitions.bin
            .pio/build/${{ matrix.environment }}/ota_data_initial.bin
          if-no-files-found: error

  # Publishes tools/web-flash/ (the browser USB flasher - see its
  # ANLEITUNG.txt) as a GitHub Pages site with this run's freshly built
  # firmware baked in, so flashing a board is just "open this link" instead
  # of the zip + local-server fallback tools/package_web_flasher.sh
  # produces. Main-branch pushes only - PRs/other branches don't touch the
  # live page customers use.
  package-pages:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: artifacts

      - run: |
          set -eu
          mkdir -p site
          cp -r tools/web-flash/. site/
          rm -rf site/bin
          for env in heltec-lora32-v2 ttgo-t-display mini-d1; do
            mkdir -p "site/bin/$env"
            cp "artifacts/firmware-$env/"* "site/bin/$env/"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: package-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
