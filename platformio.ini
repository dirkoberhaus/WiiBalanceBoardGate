; WiiBalanceBoardGate
; ESP32 bridge: connects to a Wii Balance Board over classic Bluetooth (BR/EDR)
; as a HID host, and streams live weight data over WiFi (SoftAP) as JSON,
; so devices that struggle with the board's legacy Bluetooth handshake
; (e.g. modern Macs/iPhones) can consume it over the network instead.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
