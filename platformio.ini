; WiiBalanceBoardGate
; ESP32 bridge: connects to a Wii Balance Board over classic Bluetooth (BR/EDR)
; as a HID host, and streams live weight data over WiFi (SoftAP) as JSON,
; so devices that struggle with the board's legacy Bluetooth handshake
; (e.g. modern Macs/iPhones) can consume it over the network instead.
;
; Two boards are supported, selected by which environment you build/upload:
;   pio run -e heltec-lora32-v2   (default)
;   pio run -e ttgo-t-display
; Both need an original ESP32 chip (classic Bluetooth) - see display_ssd1306.c
; / display_st7789.c for board-specific pin assumptions.

[env]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
extra_scripts = pre:patch_framework.py

[env:heltec-lora32-v2]
build_flags = -D DISPLAY_SSD1306

[env:ttgo-t-display]
build_flags = -D DISPLAY_ST7789
